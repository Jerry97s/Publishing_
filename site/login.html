<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyPort — 로그인</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <div class="topbar"><div class="container topbar__inner">
    <a class="topbar__link" href="./signup.html">회원가입</a>
    <a class="topbar__link" href="./faq.html">고객센터</a>
    <a class="topbar__link" href="./index.html">홈</a>
  </div></div>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="./index.html"><span class="brand__logo">S<span>tudy</span></span></a>
      <nav class="nav" aria-label="주요 메뉴">
        <a class="nav__link" href="./index.html">홈</a>
        <a class="nav__link" href="./sitemap.html">더보기</a>
      </nav>
      <div class="header__actions">
        <a class="btn btn--primary" href="./signup.html">가입</a>
      </div>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <nav class="breadcrumb" aria-label="경로">
        <a href="./index.html">홈</a><span class="breadcrumb__sep">›</span>
        <span>로그인</span>
      </nav>

      <div class="panel" style="max-width:440px;margin:0 auto;padding:28px;">
        <h1 class="pageTitle" style="font-size:22px;text-align:center;margin-bottom:20px;">로그인</h1>

        <form class="form" action="./mypage.html" method="get">
          <div class="formGroup">
            <label class="formLabel" for="id">아이디</label>
            <input class="input" type="text" id="id" name="id" placeholder="아이디 입력" required autocomplete="username" />
          </div>
          <div class="formGroup">
            <label class="formLabel" for="pw">비밀번호</label>
            <input class="input" type="password" id="pw" name="pw" placeholder="비밀번호" required autocomplete="current-password" />
          </div>
          <div class="formRow">
            <label class="checkbox"><input type="checkbox" name="remember" /> 로그인 상태 유지</label>
          </div>
          <div class="formActions" style="flex-direction:column;">
            <button class="btn btn--primary btn--block" type="submit">로그인</button>
            <a class="btn btn--block" href="./signup.html" style="text-align:center;">회원가입</a>
          </div>
          <p class="formHint" style="text-align:center;margin-top:12px;">
            <a href="./find-account.html">아이디/비밀번호 찾기</a>
          </p>
        </form>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="container"><p class="footer__copy">© 2026 StudyPort</p></div></footer>
</body>
</html>
